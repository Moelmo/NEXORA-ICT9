  <text x="72" y="164" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="2" fill="#f1f5f9">NEXORA <tspan fill="url(#accent)">ICT9</tspan></text>
